<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Noah's Ark</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f7efe0;
      --ink: #3a2c1d;
      --ink-soft: #7a6650;
      --accent: #c0643a;
      --accent-dark: #8f4626;
      --sky: #9fd3f0;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .hidden { display: none !important; }

    /* ---------- Layout: depends on orientation, not device ---------- */
    #app {
      width: 100%; height: 100dvh;
      display: grid;
    }
    @media (orientation: portrait) {
      #app { grid-template: "stage" 60fr "panel" 40fr / 1fr; }
    }
    @media (orientation: landscape) {
      #app { grid-template: "panel stage" 1fr / 35fr 65fr; }
    }

    #stage {
      grid-area: stage;
      position: relative; overflow: hidden; min-height: 0; min-width: 0;
      background: var(--sky);
    }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #lang-toggle {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      right: calc(10px + env(safe-area-inset-right));
      padding: 6px 12px; border-radius: 999px; border: 0;
      background: rgba(255, 255, 255, .85); color: var(--ink);
      font: 600 14px system-ui, sans-serif; cursor: pointer;
    }

    /* ---------- Text panel ---------- */
    #panel {
      grid-area: panel;
      min-height: 0;
      display: flex; flex-direction: column;
      padding: 16px calc(18px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
      background: var(--paper);
      overflow-y: auto;
    }
    @media (orientation: landscape) {
      #panel { padding-top: calc(20px + env(safe-area-inset-top)); }
    }
    #page-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 4.2vw, 24px);
      line-height: 1.4;
      user-select: text; -webkit-user-select: text;
    }
    @media (orientation: landscape) {
      #page-text { font-size: clamp(16px, 1.9vw, 24px); }
    }
    #page-ref {
      margin-top: 8px;
      font-family: Georgia, serif; font-style: italic;
      font-size: 14px; color: var(--ink-soft);
    }
    #panel-footer {
      margin-top: auto; padding-top: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    #progress { display: flex; gap: 6px; }
    #progress span {
      width: 9px; height: 9px; border-radius: 50%;
      background: #d9cbb3;
    }
    #progress span.on { background: var(--accent); }

    .btn {
      border: 0; border-radius: 999px; cursor: pointer;
      background: var(--accent); color: #fff;
      font: 700 18px system-ui, sans-serif;
      padding: 12px 26px;
    }
    .btn:active { background: var(--accent-dark); }
    #next.glow { animation: glow 1.6s ease-in-out infinite; }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192, 100, 58, .55); }
      50% { box-shadow: 0 0 0 10px rgba(192, 100, 58, 0); }
    }

    /* ---------- Cover ---------- */
    body.on-cover #app { grid-template: "stage" 1fr / 1fr; }
    body.on-cover #panel { display: none; }
    #cover {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      gap: 14px;
      padding: 24px 24px calc(40px + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    #cover > * { pointer-events: auto; }
    #cover h1 {
      margin-bottom: auto; margin-top: calc(8vh + env(safe-area-inset-top));
      font-family: Georgia, serif; font-size: clamp(34px, 9vw, 64px);
      color: #fff; text-shadow: 0 3px 10px rgba(0, 0, 0, .35);
      pointer-events: none;
    }
    .lang-row { display: flex; gap: 12px; }
    .btn.lang { background: rgba(255, 255, 255, .92); color: var(--ink); }
    .btn.lang.on { background: var(--accent); color: #fff; }
  </style>
</head>
<body class="on-cover">
  <div id="app">
    <div id="stage">
      <button id="lang-toggle" class="hidden"></button>
    </div>
    <div id="panel">
      <p id="page-text"></p>
      <p id="page-ref"></p>
      <div id="panel-footer">
        <div id="progress"></div>
        <button id="next" class="btn hidden"></button>
      </div>
    </div>
  </div>

  <div id="cover">
    <h1 id="cover-title">Noah's Ark</h1>
    <div class="lang-row">
      <button id="btn-es" class="btn lang">Español</button>
      <button id="btn-en" class="btn lang">English</button>
    </div>
    <button id="btn-start" class="btn hidden"></button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
